<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text To Speech Demo</title>

    <link rel="stylesheet" href="../css/textToSpeech.css" />

    <!-- Demo logic -->
    <script type="module" src="../textToSpeech.js"></script>
  </head>

  <body>
    <div id="mainScreen" class="screen loading">
      <canvas id="renderCanvas"></canvas>

      <div id="uiPanel" class="panel">
        <button id="backButton" class="back">Back</button>
        <label for="characterSelect">Character:</label>
        <select id="characterSelect"></select>
        <button id="changeCharacterButton">Load</button>
        <textarea id="speechText" rows="8">
Hello. I'm Cristine, a Sumerian host. It's nice to meet you.</textarea
        >
        <button id="speakButton">Speak</button>
      </div>
    </div>

    <div id="loadingScreen" class="screen">
      <p>Loading...</p>
    </div>
  </body>
</html>
